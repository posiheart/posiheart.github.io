name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is only used for validation. There is no install or build step.
      - name: Set up validation runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate static files
        run: node scripts/check.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Collect website files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
